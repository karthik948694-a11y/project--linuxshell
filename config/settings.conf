# Linux Daily Reporter configuration
# Edit this file with a text editor. No dashboard is provided.

APP_NAME="Linux Daily Reporter"
APP_VERSION="1.3.0"
APP_SHORT_NAME="LDR"

# Thresholds (percent)
CPU_WARN_THRESHOLD=80
MEM_WARN_THRESHOLD=85
DISK_WARN_THRESHOLD=90

# Disk path used for the primary disk warning
DISK_WARN_PATH="/"

# Report output: space-separated list of txt, html, csv
REPORT_FORMATS="txt html csv"

# Optional SQLite history (requires sqlite3)
SQLITE_ENABLED=false
SQLITE_DB="data/reports.db"

# Connectivity check
PING_TARGET="8.8.8.8"
PING_COUNT=2

# Process listing limits
TOP_PROCESS_LIMIT=8

# Security analysis windows
SECURITY_LOG_HOURS=24
FAILED_LOGIN_UNUSUAL=8

# Logging
LOG_LEVEL="INFO"
LOG_RETENTION_DAYS=30
REPORT_RETENTION_DAYS=90

# Cron automation (managed by scheduler/cron_manager.sh)
CRON_ENABLED=false
CRON_HOUR=8
CRON_MINUTE=0
CRON_TAG="linux-daily-reporter"

# Collection intervals
CPU_SAMPLE_SECONDS=1
